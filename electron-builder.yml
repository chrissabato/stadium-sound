appId: com.venue.audioplayer
productName: Stadium Sound
publish:
  provider: github
  owner: chrissabato
  repo: stadium-sound
  private: false
  releaseType: release
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
win:
  icon: resources/icon.ico
  artifactName: Stadium-Sound-Setup-${arch}.exe
  target:
    - target: nsis
      arch: [x64, arm64]
  azureSignOptions:
    publisherName: "CN=Christopher Sabato, O=Christopher Sabato, L=Albany, S=or, C=US"
    endpoint: https://wus2.codesigning.azure.net
    codeSigningAccountName: stadiumsound
    certificateProfileName: stadium-sound-signing
mac:
  icon: resources/icon.png
  artifactName: Stadium-Sound-${arch}.dmg
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
