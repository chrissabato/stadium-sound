name: Debug Secret Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Hash secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "CSC_KEY_PASSWORD length: ${#CSC_KEY_PASSWORD}"
          echo -n "$CSC_KEY_PASSWORD" | shasum -a 256
          echo "CSC_LINK length: ${#CSC_LINK}"
          echo -n "$CSC_LINK" | shasum -a 256
          echo -n "$CSC_LINK" | base64 -d > /tmp/test.p12
          echo "decoded p12 size: $(wc -c < /tmp/test.p12)"
          shasum -a 256 /tmp/test.p12
          security create-keychain -p testpass123 /tmp/test.keychain
          security import /tmp/test.p12 -k /tmp/test.keychain -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign 2>&1 || true
